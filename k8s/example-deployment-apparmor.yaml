# Example workload on the core-apparmor image, for AppArmor nodes (e.g. Ubuntu
# node pools on EKS/AKS/GKE). "pod-security.kubernetes.io/enforce: restricted"
# makes the built-in Pod Security Admission enforce non-root, no privilege
# escalation, drop ALL capabilities, seccomp, and no privileged containers.
# The apparmor-required label turns on apparmor-admission-policy.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: minified-apparmor-apps
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    minified.dev/apparmor-required: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example
  namespace: minified-apparmor-apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: example }
  template:
    metadata:
      labels: { app: example }
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        minified.dev/apparmor: enforcing
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
        appArmorProfile:
          type: RuntimeDefault   # or Localhost + localhostProfile: minified-<name> (must be loaded on the nodes)
      containers:
        - name: app
          # An image built FROM minified/ubuntu-core:24.04-apparmor that sets CMD (not ENTRYPOINT),
          # so container-guard runs first and refuses to start if the pod isn't AppArmor-confined.
          image: registry.example.com/my-app:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
